# The app. On Coolify (as for findme), create a "Docker Compose" resource from this repo and set:
#   RAILS_MASTER_KEY     runtime only, see the note at the top of Dockerfile
#   ADMIN_PASSWORD       for /admin; without it the review pages are switched off
#   ANTHROPIC_API_KEY    for the classifier (Claude Haiku); a key from platform.claude.com
#   CLAUDE_MODEL         optional; default claude-haiku-5-5
#   GEONAMES_LOCALITIES  optional; 0 skips villages and districts (a 420 MB monthly download, ~400 MB more RAM)
# The web container downloads the GeoNames gazetteer into the storage volume on boot, and again on any
# boot once it is a month old. To classify with a local model instead of the API, add
# docker-compose.ollama.yml (see the README).
services:
  web:
    build: .
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      LOCAL_THRESHOLD: ${LOCAL_THRESHOLD:-0.6}
      GEONAMES_LOCALITIES: ${GEONAMES_LOCALITIES:-1}
    volumes:
      - storage:/rails/storage
    ports:
      - "3000"

volumes:
  storage:
